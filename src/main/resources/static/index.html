<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>秒杀系统</title>
<script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .wrap { width: 100%; max-width: 420px; }
  .title {
    color: #fff;
    font-size: 22px;
    font-weight: 600;
    text-align: center;
    margin-bottom: 6px;
    letter-spacing: 2px;
  }
  .subtitle {
    color: rgba(255,255,255,.45);
    font-size: 13px;
    text-align: center;
    margin-bottom: 22px;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    padding: 26px;
    box-shadow: 0 18px 50px rgba(0,0,0,.35);
  }
  .goods-name {
    font-size: 19px;
    font-weight: 600;
    color: #1a1a2e;
    margin-bottom: 14px;
  }
  .price-row { display: flex; align-items: baseline; gap: 8px; margin-bottom: 18px; }
  .price { color: #e63946; font-size: 30px; font-weight: 700; }
  .price::before { content: "¥"; font-size: 16px; margin-right: 2px; }
  .stock-box { margin-bottom: 20px; }
  .stock-label {
    display: flex; justify-content: space-between;
    font-size: 13px; color: #666; margin-bottom: 7px;
  }
  .stock-bar { height: 8px; background: #f0f0f3; border-radius: 4px; overflow: hidden; }
  .stock-fill {
    height: 100%; border-radius: 4px;
    background: linear-gradient(90deg, #ff6b6b, #e63946);
    transition: width .4s ease;
  }
  .user-row { display: flex; gap: 10px; margin-bottom: 16px; }
  .user-row input {
    flex: 1; padding: 11px 13px; border: 1px solid #e0e0e6; border-radius: 9px;
    font-size: 14px; outline: none; transition: border-color .2s;
  }
  .user-row input:focus { border-color: #e63946; }
  .btn {
    width: 100%; padding: 14px; border: none; border-radius: 10px;
    background: linear-gradient(135deg, #ff6b6b, #e63946);
    color: #fff; font-size: 16px; font-weight: 600; cursor: pointer;
    transition: transform .15s, box-shadow .15s;
  }
  .btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(230,57,70,.35); }
  .btn:disabled { opacity: .6; cursor: not-allowed; }
  .result {
    margin-top: 18px; padding: 14px; border-radius: 10px;
    font-size: 14px; line-height: 1.6; word-break: break-all;
  }
  .result.success { background: #e8f8ee; color: #1a7f45; }
  .result.error { background: #fdecee; color: #c1121f; }
  .result.pending { background: #fff6e5; color: #a05a00; }
  .order-no { display: block; margin-top: 6px; font-size: 12px; opacity: .75; font-family: monospace; }
</style>
</head>
<body>
<div id="app" class="wrap">
  <div class="title">限时秒杀</div>
  <div class="subtitle">Redis 预扣 · MQ 异步下单</div>

  <div class="card" v-if="goods">
    <div class="goods-name">{{ goods.name }}</div>
    <div class="price-row"><span class="price">{{ goods.price }}</span></div>

    <div class="stock-box">
      <div class="stock-label">
        <span>剩余库存</span>
        <span>{{ goods.stock }} 件</span>
      </div>
      <div class="stock-bar">
        <div class="stock-fill" :style="{ width: stockPercent + '%' }"></div>
      </div>
    </div>

    <div class="user-row">
      <input v-model="userId" type="number" placeholder="用户 ID" />
    </div>

    <button class="btn" :disabled="loading || goods.stock <= 0" @click="buy">
      {{ goods.stock <= 0 ? '已抢光' : (loading ? '抢购中...' : '立即抢购') }}
    </button>

    <div v-if="result" class="result" :class="result.type">
      {{ result.text }}
      <span v-if="result.orderNo" class="order-no">订单号：{{ result.orderNo }}</span>
    </div>
  </div>

  <div class="card" v-else style="text-align:center;color:#888">加载中...</div>
</div>

<script>
const { createApp } = Vue;

createApp({
  data() {
    return {
      goods: null,
      userId: Math.floor(Math.random() * 90000) + 10000,
      loading: false,
      result: null,
      maxStock: 100
    };
  },
  computed: {
    stockPercent() {
      if (!this.goods) return 0;
      return Math.max(0, Math.min(100, this.goods.stock / this.maxStock * 100));
    }
  },
  mounted() {
    this.loadGoods();
    this.timer = setInterval(this.loadGoods, 2000);
  },
  unmounted() {
    clearInterval(this.timer);
  },
  methods: {
    async loadGoods() {
      try {
        const r = await fetch('/api/goods/1');
        this.goods = await r.json();
        if (this.goods.stock > this.maxStock) this.maxStock = this.goods.stock;
      } catch (e) {}
    },
    async buy() {
      this.loading = true;
      this.result = null;
      try {
        const r = await fetch('/api/seckill/1?userId=' + this.userId, { method: 'POST' });
        const data = await r.json();
        if (data.code === 0) {
          this.result = { type: 'pending', text: '抢购成功，订单生成中...', orderNo: data.orderNo };
          this.pollOrder(data.orderNo);
        } else {
          this.result = { type: 'error', text: data.message };
        }
      } catch (e) {
        this.result = { type: 'error', text: '请求失败，请重试' };
      } finally {
        this.loading = false;
        this.loadGoods();
      }
    },
    async pollOrder(orderNo) {
      for (let i = 0; i < 10; i++) {
        await new Promise(resolve => setTimeout(resolve, 500));
        try {
          const r = await fetch('/api/order/' + orderNo);
          const data = await r.json();
          if (data.ready) {
            this.result = { type: 'success', text: '秒杀成功，订单已生成', orderNo: orderNo };
            return;
          }
        } catch (e) {}
      }
      this.result = { type: 'pending', text: '订单仍在处理中，请稍后凭订单号查询', orderNo: orderNo };
    }
  }
}).mount('#app');
</script>
</body>
</html>
